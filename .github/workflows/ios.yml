name: Build FloatingByPeaga

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Criar projeto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project FloatingByPeaga.xcodeproj \
            -scheme FloatingByPeaga \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ver arquivos compilados
        run: |
          echo "=== BUILD ==="
          find build/Build/Products/Release-iphoneos -maxdepth 2 -type f

      - name: Criar IPA
        run: |
          echo "=== CRIANDO IPA ==="

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/FloatingByPeaga.app \
            Payload/

          zip -qry FloatingByPeaga.ipa Payload

          echo "=== VERIFICANDO ==="
          unzip -l FloatingByPeaga.ipa

          rm -rf Payload

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingByPeaga-IPA
          path: FloatingByPeaga.ipa
