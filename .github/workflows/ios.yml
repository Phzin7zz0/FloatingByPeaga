name: Build FloatingByPeaga

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Criar projeto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone
        run: |
          xcodebuild \
          -project FloatingByPeaga.xcodeproj \
          -scheme FloatingByPeaga \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          build

      - name: Criar IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/FloatingByPeaga.app" -type d | head -n 1)

          echo "App encontrado em: $APP_PATH"

          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/FloatingByPeaga.app

          cd ipa
          zip -qry ../FloatingByPeaga.ipa Payload

          cd ..
          ls -lh FloatingByPeaga.ipa

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingByPeaga-IPA
          path: FloatingByPeaga.ipa
