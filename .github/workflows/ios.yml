name: Build FloatingByPeaga

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Criar projeto Xcode
        run: xcodegen generate

      - name: Compilar aplicativo
        run: |
          xcodebuild \
            -project FloatingByPeaga.xcodeproj \
            -scheme FloatingByPeaga \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Criar IPA corretamente
        run: |
          echo "=== PROCURANDO APP ==="

          APP_PATH="build/Build/Products/Release-iphoneos/FloatingByPeaga.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERRO: APP não encontrado!"
            find build -name "*.app" -type d
            exit 1
          fi

          echo "APP encontrado:"
          ls -la "$APP_PATH"

          echo "=== CRIANDO IPA ==="

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -r FloatingByPeaga.ipa Payload

          rm -rf Payload

          echo "=== VERIFICANDO IPA ==="
          unzip -l FloatingByPeaga.ipa

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingByPeaga-IPA
          path: FloatingByPeaga.ipa
