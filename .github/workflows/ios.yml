name: Build FloatingByPeaga IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Instalar XcodeGen
        run: brew install xcodegen


      - name: Criar projeto Xcode
        run: xcodegen generate


      - name: Compilar Archive
        run: |
          xcodebuild \
            -project FloatingByPeaga.xcodeproj \
            -scheme FloatingByPeaga \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/FloatingByPeaga.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""


      - name: Criar IPA
        run: |
          mkdir -p Payload
          cp -R build/FloatingByPeaga.xcarchive/Products/Applications/FloatingByPeaga.app Payload/

          mkdir -p output

          zip -r output/FloatingByPeaga.ipa Payload

          rm -rf Payload


      - name: Salvar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingByPeaga-IPA
          path: output/FloatingByPeaga.ipa
          if-no-files-found: error
