name: Build FloatingByPeaga

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Criar projeto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project FloatingByPeaga.xcodeproj \
            -scheme FloatingByPeaga \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Criar IPA
        run: |
          echo "=== PROCURANDO APP ==="

          APP_PATH=$(find build -type d -name "*.app" | head -n 1)

          echo "APP encontrado: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: Nenhum .app encontrado!"
            exit 1
          fi

          echo "=== CRIANDO IPA ==="

          rm -rf Payload FloatingByPeaga.ipa

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -r FloatingByPeaga.ipa Payload

          echo "=== IPA CRIADA ==="
          ls -lh FloatingByPeaga.ipa

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingByPeaga-IPA
          path: FloatingByPeaga.ipa
          if-no-files-found: error
          retention-days: 7
