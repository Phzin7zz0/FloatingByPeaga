name: Build FloatingByPeaga

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Criar projeto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project FloatingByPeaga.xcodeproj \
            -scheme FloatingByPeaga \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Criar IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: .app não encontrado"
            exit 1
          fi

          rm -rf Payload FloatingByPeaga.ipa
          mkdir Payload

          cp -R "$APP_PATH" Payload/

          zip -qry FloatingByPeaga.ipa Payload

          echo "=== ESTRUTURA DA IPA ==="
          unzip -l FloatingByPeaga.ipa

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingByPeaga-IPA
          path: FloatingByPeaga.ipa
          if-no-files-found: error
