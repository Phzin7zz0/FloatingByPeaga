name: Build FloatingByPeaga IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Instalar XcodeGen
        run: brew install xcodegen


      - name: Criar projeto Xcode
        run: xcodegen generate


      - name: Criar Archive
        run: |
          xcodebuild archive \
            -project FloatingByPeaga.xcodeproj \
            -scheme FloatingByPeaga \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/FloatingByPeaga.xcarchive \
            CODE_SIGNING_ALLOWED=NO


      - name: Criar IPA
        run: |
          mkdir -p Payload

          cp -R \
            build/FloatingByPeaga.xcarchive/Products/Applications/FloatingByPeaga.app \
            Payload/

          zip -r \
            FloatingByPeaga.ipa \
            Payload

          rm -rf Payload


      - name: Salvar IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingByPeaga-IPA
          path: FloatingByPeaga.ipa
          if-no-files-found: error
